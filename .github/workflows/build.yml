name: "Build website and deploy preview environment"

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: "Build website and deploy preview environment"
    # x64: the Static Web Apps CLI has no arm64 build (Azure/static-web-apps-cli#987).
    runs-on: ubuntu-26.04
    # The preview environment holds only the Static Web App deployment token. Pull request code
    # gets no Azure or Cloudflare credentials.
    environment: preview
    permissions:
      contents: read
      pull-requests: write # comment the preview URL on the PR
    env:
      APP_DIR: "src"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Pinned in tools/swa-cli. Install scripts stay off: the only package that has one is keytar, an
      # optional credential store the token-based deploy never loads.
      - name: Install the Static Web Apps CLI
        run: npm ci --prefix tools/swa-cli --ignore-scripts --no-audit --no-fund
      # One preview environment per pull request, named after its number like the
      # Azure/static-web-apps-deploy action named them.
      - name: Deploy to the preview environment
        id: deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          # The CLI prints the deployed URL on stderr, with colour codes around it.
          npm exec --prefix tools/swa-cli --no -- swa deploy "$APP_DIR" --env "$PR_NUMBER" 2>&1 | tee "$RUNNER_TEMP/swa-deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.azurestaticapps\.net' "$RUNNER_TEMP/swa-deploy.log" | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::The Static Web Apps CLI did not report a preview URL."
            exit 1
          fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
      - name: Post or update the preview comment
        uses: actions/github-script@v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  close_pull_request_job:
    name: Close Pull Request Job
    # x64: StaticSitesClient has no arm64 build (Azure/static-web-apps-cli#987).
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    environment: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the Static Web Apps CLI
        run: npm ci --prefix tools/swa-cli --ignore-scripts --no-audit --no-fund
      # The CLI only uploads, but the StaticSitesClient binary it deploys with also closes environments,
      # which is what Azure/static-web-apps-deploy's "close" action ran. getDeployClientPath() downloads
      # the binary the pinned CLI uses and checks its hash. It logs to stdout, so the path goes through
      # $GITHUB_OUTPUT.
      - name: Get StaticSitesClient
        id: client
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            const { getDeployClientPath } = await import('./tools/swa-cli/node_modules/@azure/static-web-apps-cli/dist/core/deploy-client.js');
            const { binary } = await getDeployClientPath();
            appendFileSync(process.env.GITHUB_OUTPUT, 'binary=' + binary + '\n');
          "
      # Runs the binary the way the action's entrypoint did (`StaticSitesClient close`, inputs as
      # INPUT_* variables): it then reads the pull request from $GITHUB_EVENT_PATH and closes the
      # environment named after its number. In the CLI's mode (DEPLOYMENT_PROVIDER=SwaCli) close
      # has no pull request ID and Azure rejects it.
      - name: Close the preview environment
        env:
          BINARY: ${{ steps.client.outputs.binary }}
          INPUT_ACTION: close
          INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: '"$BINARY" close'
