name: "Build website and deploy preview environment"

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: "Build website and deploy preview environment"
    runs-on: ubuntu-latest
    # The preview environment holds only the Static Web App deployment token. Pull request code
    # gets no Azure or Cloudflare credentials.
    environment: preview
    permissions:
      contents: read
      pull-requests: write # the deploy action comments the preview URL on the PR
    env:
      APP_DIR: "src"
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.APP_DIR }}
          skip_app_build: true

  close_pull_request_job:
    name: Close Pull Request Job
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    environment: preview
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
