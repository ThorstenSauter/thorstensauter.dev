name: Terraform validate and plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Terraform configuration
        uses: ThorstenSauter/terraform-actions/validate@6a10384401bd07a5845742364b67da37334eb03d # v1.5.1
        with:
          terraform-version: ${{ vars.TERRAFORM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          infra-directory: ${{ vars.INFRA_DIRECTORY }}

  plan-production:
    name: Plan production environment
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-state-production
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ENVIRONMENT_NAME: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Terraform plan
        uses: ThorstenSauter/terraform-actions/plan@6a10384401bd07a5845742364b67da37334eb03d # v1.5.1
        with:
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          terraform-version: ${{ vars.TERRAFORM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          infra-directory: ${{ vars.TF_WORKING_DIRECTORY }}
          resource-group: ${{ vars.TF_BACKEND_RESOURCE_GROUP_NAME }}
          storage-account: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT_NAME }}
          container: ${{ vars.TF_BACKEND_STATE_CONTAINER_NAME }}
          state-file: ${{ vars.TF_BACKEND_STATE_FILE_NAME }}
