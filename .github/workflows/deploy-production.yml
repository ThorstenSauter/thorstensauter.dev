name: Deploy to production environment

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancelled: stopping a terraform apply part way can leave the state locked. PR jobs stay
# out of this group on purpose and wait on the state lock (lock-timeout) instead: a third queued
# job in a shared group would cancel a pending deployment.
concurrency:
  group: terraform-state-production
  cancel-in-progress: false

jobs:
  apply-production:
    name: Apply production environment
    runs-on: ubuntu-26.04-arm
    environment: production
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Terraform apply
        uses: ThorstenSauter/terraform-actions/apply@v1.9.1
        with:
          infra-directory: ${{ vars.TF_WORKING_DIRECTORY }}
          resource-group: ${{ vars.TF_BACKEND_RESOURCE_GROUP_NAME }}
          storage-account: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT_NAME }}
          container: ${{ vars.TF_BACKEND_STATE_CONTAINER_NAME }}
          state-file: ${{ vars.TF_BACKEND_STATE_FILE_NAME }}

  deploy:
    name: Deploy to production Azure Static Web App
    needs:
      - apply-production
    # x64: the Static Web Apps CLI has no arm64 build (Azure/static-web-apps-cli#987).
    runs-on: ubuntu-26.04
    environment: production
    env:
      APP_DIR: "src"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Terraform init
        uses: ThorstenSauter/terraform-actions/init@v1.9.1
        with:
          infra-directory: ${{ vars.TF_WORKING_DIRECTORY }}
          resource-group: ${{ vars.TF_BACKEND_RESOURCE_GROUP_NAME }}
          storage-account: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT_NAME }}
          container: ${{ vars.TF_BACKEND_STATE_CONTAINER_NAME }}
          state-file: ${{ vars.TF_BACKEND_STATE_FILE_NAME }}
      - name: Terraform apply refresh only
        working-directory: ${{ vars.TF_WORKING_DIRECTORY }}
        run: terraform apply -refresh-only -auto-approve -input=false -lock-timeout=10m
      - name: Retrieve deployment token
        id: token-retrieval
        working-directory: ${{ vars.TF_WORKING_DIRECTORY }}
        run: |
          token=$(terraform output -raw deployment_token)
          echo "::add-mask::$token"
          echo "deployment-token=$token" >> "$GITHUB_OUTPUT"
      # Pinned in tools/swa-cli. Install scripts stay off: the only package that has one is keytar, an
      # optional credential store the token-based deploy never loads.
      - name: Install the Static Web Apps CLI
        run: npm ci --prefix tools/swa-cli --ignore-scripts --no-audit --no-fund
      - name: Deploy to Azure Static Web Apps
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ steps.token-retrieval.outputs.deployment-token }}
        run: npm exec --prefix tools/swa-cli --no -- swa deploy "$APP_DIR" --env production
